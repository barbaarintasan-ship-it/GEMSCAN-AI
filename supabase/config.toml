project_id = "gemscan-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "enterprise", "geo"]

[db]
port = 54322

[auth]
enabled = true
site_url = "https://gemscan.ai"
additional_redirect_urls = ["https://gemscan.ai/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
# Mobile sign-up must work without waiting on an email round-trip. The built-in
# Supabase mailer is heavily rate-limited (429 over_email_send_rate_limit) and is
# not meant for production delivery, so requiring confirmation made new accounts
# appear to "not get created" (signUp returned no session → the app bounced back
# to login). Disabling confirmation lets signUp return a session immediately.
# NOTE: this must also be turned off on the hosted project (Dashboard →
# Authentication → Sign In / Providers → Email → "Confirm email" OFF), or applied
# via `supabase link` + `supabase config push`. config.toml alone only affects
# the local `supabase start` stack.
enable_confirmations = false

[functions.verify-subscription]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true

# The AI Scan Pipeline orchestrator — called by a signed-in mobile user for
# their own scan, so it verifies the caller's Supabase session JWT like
# verify-subscription does.
[functions.orchestrate-scan]
verify_jwt = true

[functions.precheck-object]
verify_jwt = true

[functions.estimate-value]
verify_jwt = true

# Called server-to-server by the website payment plugin, authenticated with a
# shared secret (ACTIVATION_SECRET) instead of a user JWT.
[functions.activate-subscription]
verify_jwt = false

# Read-only business analytics for the WordPress dashboard. Called
# server-to-server by the payment plugin with the same shared secret
# (ACTIVATION_SECRET), so it must skip Supabase JWT verification.
[functions.gemscan-analytics]
verify_jwt = false

# Full registrant list for the WordPress admin "Registered Users" page. Same
# server-to-server shared-secret model as gemscan-analytics.
[functions.gemscan-users]
verify_jwt = false

# Webhook endpoints verify authenticity via provider signature, not Supabase
# JWT (the caller is Stripe/the mobile-money gateway, not a logged-in user).
[functions.stripe-webhook]
verify_jwt = false

[functions.mobile-money-webhook]
verify_jwt = false

# $5 High-Value Report payment webhook — same convention as the two webhooks
# above: the caller is a payment gateway, verified via its own HMAC signature
# (X-Gateway-Signature), not a Supabase JWT.
[functions.high-value-report-webhook]
verify_jwt = false

# $5 Gold Report payment webhook — same HMAC-signed, gateway-called convention.
[functions.gold-report-webhook]
verify_jwt = false

# $10 Artifact Report payment webhook — same HMAC-signed, gateway-called convention.
[functions.artifact-report-webhook]
verify_jwt = false

# Enterprise context/status — user-facing, requires a valid app JWT.
[functions.enterprise-context]
verify_jwt = true

# GeoContext runtime — user-facing, requires a valid app JWT (+ enterprise gate).
[functions.geocontext]
verify_jwt = true

# Sample Submission API (Sprint 4.2) — user-facing, requires a valid app JWT (+ enterprise gate).
[functions.enterprise-samples]
verify_jwt = true

# Team Phase 7 — cross-contributor cell synthesis (Claude narrates, never scores).
# User-facing, requires a valid app JWT (+ enterprise gate + is_mission_manager in the RPCs).
[functions.enterprise-mission-synthesis]
verify_jwt = true

# Team Phase 9 — follow-up mission from a completed mission's best-scoring
# cell. User-facing, requires a valid app JWT (+ is_mission_manager in the RPC).
[functions.create-followup-mission]
verify_jwt = true

# Manually create a mission area with no AI recommendation/scoring involved —
# fills the gap left when the server has no evidence for a location the
# manager already knows matters. User-facing, requires a valid app JWT
# (+ is_mission_manager in the RPC).
[functions.create-manual-area]
verify_jwt = true

# Field sync: an expedition, its observations and its traverse, uploaded from a
# device outbox. Authenticated like every other enterprise route.
[functions.expeditions]
verify_jwt = true

# Phase 11 — human geological review of a mission's exploration_area
# (accept/reject/needs-more-data). User-facing, requires a valid app JWT
# (+ is_mission_manager in the RPC).
[functions.review-area]
verify_jwt = true

# Phase 12 — "Why A > B" deterministic comparison of two areas in the same
# mission. Read-only. User-facing, requires a valid app JWT
# (+ is_mission_member in the RPC).
[functions.compare-areas]
verify_jwt = true

# Phase 13 — geological analogue matching: real, named occurrences elsewhere
# sharing an area's commodity/deposit_type. Read-only. User-facing, requires
# a valid app JWT (+ is_mission_member in the RPC).
[functions.area-geological-analogues]
verify_jwt = true

# Phase 14 — Unified Target Report: pure aggregation of Phase 7/10/11's
# already-persisted data into one document. Read-only. User-facing, requires
# a valid app JWT (+ is_mission_member in the RPC).
[functions.target-report]
verify_jwt = true

# Phase 16 — Remote-Sensing Spectral Intelligence (Iron Oxide Ratio via
# Sentinel-2 L2A / Copernicus Data Space Ecosystem). SENTINEL_HUB_CLIENT_ID/
# SECRET live only in this function's environment; the device never sees
# them or the CDSE access token. Not wired into any deterministic score.
[functions.area-spectral-index]
verify_jwt = true

# Object-storage presigning. The R2 secret lives only in this function's
# environment; the device receives short-lived URLs for one object at a time.
[functions.r2-presign]
verify_jwt = true

# Field-mission analysis. Separate from expeditions/sync ON PURPOSE: sync is
# evidence preservation and must stay fast, this is interpretation and takes tens
# of seconds. An outage in the model must never be able to make collection look
# broken. User-facing, so a real JWT — the device asks for its own mission.
[functions.analyze-mission]
verify_jwt = true

# Geological Intelligence Engine (Sprint 4.3) — called server-to-server with the
# service role (auto-triggered by enterprise-samples), not a user JWT. Its handler
# checks the service-role bearer itself, so JWT verification is off like the webhooks.
[functions.analyze-sample]
verify_jwt = false

# Geologist review endpoint (Review Console S2) — user-facing, requires a valid app
# JWT (+ enterprise gate + reviewer RBAC in the handler).
[functions.review-sample]
verify_jwt = true

# Serves the Review Console SPA shell as text/html (Storage forces text/plain on
# HTML). Public page — no JWT; the app's own login + RLS gate all data.
[functions.console]
verify_jwt = false

# Phase 2B — H3 area enumeration (Team Mission Mode). User-facing: acts as the
# caller's own JWT throughout (never service role); every SECURITY DEFINER RPC
# it calls makes its own auth.uid() authorization decision.
[functions.generate-mission-cells]
verify_jwt = true
