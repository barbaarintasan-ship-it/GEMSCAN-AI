name: CI

# Mirrors, exactly, the manual verification commands already proven to pass
# in 09-AI-Scan-Pipeline-Production-Verification-Report.md and
# FINAL-DEVOPS-VERIFICATION-REPORT.md — this workflow automates checks that
# were already confirmed working by hand, it does not introduce new ones.

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

jobs:
  mobile-quality:
    name: Mobile — TypeScript / ESLint / Jest / Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: mobile
        run: npx eslint .

      - name: Jest unit tests
        working-directory: mobile
        run: npx jest --ci

      - name: Security audit (informational — full report)
        working-directory: mobile
        run: npm audit || true
        continue-on-error: true

      - name: Security audit (blocking — fail only on critical severity)
        working-directory: mobile
        run: npm audit --audit-level=critical

  edge-functions:
    name: Supabase Edge Functions — Deno typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Typecheck every Edge Function entry point
        run: |
          set -e
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f"
            deno check "$f"
          done

      - name: Deno unit tests (ensemble voting)
        run: deno test supabase/functions/orchestrate-scan/ensemble.test.ts

      - name: Deno unit tests (entitlements)
        run: deno test supabase/functions/_shared/entitlements.test.ts

      - name: Deno integration tests (orchestrate-scan)
        run: deno test --allow-env supabase/functions/orchestrate-scan/index.test.ts

  android-build:
    name: Build verification — Android debug APK
    runs-on: ubuntu-latest
    needs: [mobile-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Generate debug keystore
        # mobile/android/app/debug.keystore is gitignored on purpose (a
        # keystore file has no business being committed, even the standard
        # debug one) — so CI generates the same well-known debug keystore
        # Android Studio itself generates locally, using its documented
        # fixed alias/password. This never touches release signing.
        run: |
          keytool -genkeypair -v \
            -keystore mobile/android/app/debug.keystore \
            -storetype PKCS12 \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
