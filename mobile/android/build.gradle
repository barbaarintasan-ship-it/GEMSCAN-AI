// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '23')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '35')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.23'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    // Guarantee the R8 override below actually wins over the R8 that AGP 8.6.0
    // pulls in transitively (a plain classpath entry can otherwise lose the
    // version conflict). Without this, Google Play keeps flagging the
    // `$$ExternalSyntheticApiModelOutline` removeFirst()/removeLast() synthetic.
    configurations.classpath {
        resolutionStrategy {
            force('com.android.tools:r8:8.7.18')
        }
    }
    dependencies {
        // Override R8 to a newer build than the one bundled with AGP 8.6.0.
        // AGP 8.6.0's R8 emits a `$$ExternalSyntheticApiModelOutline` synthetic
        // whose bytecode Google Play's static analysis reports as a Kotlin
        // removeFirst()/removeLast() usage (e.g. in expo.modules.camera.
        // ExpoCameraView) and BLOCKS the release for review — even though no
        // source in the app or its dependencies actually calls those functions.
        // Newer R8 no longer emits that pattern. Declared BEFORE the AGP classpath
        // so this version wins over AGP's transitive R8.
        classpath('com.android.tools:r8:8.7.18')
        // Pin AGP 8.6.0 (compatible with Gradle 8.8): compileSdk/targetSdk 35
        // requires Android Gradle Plugin 8.6.0+, which Google Play now mandates.
        classpath('com.android.tools.build:gradle:8.6.0')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
// @generated begin expo-camera-import - expo prebuild (DO NOT MODIFY) sync-f244f4f3d8bf7229102e8f992b525b8602c74770
def expoCameraMavenPath = new File(["node", "--print", "require.resolve('expo-camera/package.json')"].execute(null, rootDir).text.trim(), "../android/maven")
allprojects { repositories { maven { url(expoCameraMavenPath) } } }
// @generated end expo-camera-import

// Sonatype has sunset oss.sonatype.org; its snapshots server now returns 504s.
// The React Native / Expo Gradle tooling still registers it as a repository, so
// Gradle times out querying it for any dependency not found in an earlier repo
// (cameraview, Android-Image-Cropper, ...), breaking production builds. Exclude
// ALL content from that repo so Gradle never contacts it. The artifacts it used
// to serve resolve from other declared repos: cameraview from expo-camera's
// bundled local Maven repo (above) and Android-Image-Cropper from JitPack.
allprojects {
    repositories.all { repo ->
        def u = repo.hasProperty("url") ? repo.url?.toString() : null
        if (u != null && u.contains("oss.sonatype.org")) {
            repo.content { excludeGroupByRegex ".*" }
        }
    }
}