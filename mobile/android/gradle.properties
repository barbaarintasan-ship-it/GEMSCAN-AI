# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# -Djava.io.tmpdir is load-bearing on Windows.
#
# kapt in expo-updates extracts a native SQLite JDBC library while it runs. Without
# this the JVM inherited java.io.tmpdir=C:\WINDOWS from the launching shell and the
# extraction failed with AccessDeniedException — surfacing only as
# ":expo-updates:kaptReleaseKotlin FAILED", which says nothing about temp files.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Djava.io.tmpdir=C:/Users/awmus/AppData/Local/Temp -Dorg.sqlite.tmpdir=C:/Users/awmus/AppData/Local/Temp

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Enable GIF support in React Native images (~200 B increase)
expo.gif.enabled=true
# Enable webp support in React Native images (~85 KB increase)
expo.webp.enabled=true
# Enable animated webp support (~3.4 MB increase)
# Disabled by default because iOS doesn't support animated webp
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging to compress native libraries in the resulting APK.
expo.useLegacyPackaging=false

# ── Target Android 16 (API 36) for Google Play compliance ──────────────────
# Play requires apps to target API 36 to keep publishing updates (deadline
# 2026-08-31). SDK platform 36 + build-tools 36 are installed. AGP 8.6.0
# predates official API 36 support, so we suppress its "untested compileSdk"
# warning — the API 36 android.jar is backward compatible and the build is
# unaffected (verified by a release build).
android.compileSdkVersion=36
android.targetSdkVersion=36
android.buildToolsVersion=36.0.0
android.suppressUnsupportedCompileSdk=36

# kapt runs in its own worker JVM by default, which does NOT inherit the daemon
# jvmargs above — so java.io.tmpdir stayed at C:/WINDOWS there and the SQLite
# JDBC native extraction inside expo-updates failed with AccessDeniedException.
# Running it in the daemon process gives it the writable temp directory.
kapt.workers.isolation=none
# THE KOTLIN DAEMON is a separate JVM from the Gradle daemon, with its own args.
# kapt runs there, so org.gradle.jvmargs above never reached it — which is why
# java.io.tmpdir stayed at C:/WINDOWS and the SQLite JDBC native extraction inside
# expo-updates failed with AccessDeniedException. C:/WINDOWS is not writable by
# this user and holds an undeletable stale copy of the library.
kotlin.daemon.jvmargs=-Xmx2048m -Djava.io.tmpdir=C:/Users/awmus/AppData/Local/Temp -Dorg.sqlite.tmpdir=C:/Users/awmus/AppData/Local/Temp
# The JDK Gradle builds with, pinned.
#
# The Android Gradle plugin needs 17 or newer. This machine has Java 11 first on
# PATH, so every gradlew invocation from a plain shell failed with
# "requires Java 17 to run" until JAVA_HOME was exported by hand each time.
# Pinning it here means the wrapper works from any shell, for anyone.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
